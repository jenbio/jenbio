<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jenbio · Biology by Inquiry</title>
<style>
  :root{--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--bg:#f5f5f7;--accent:#0071e3;--green:#2e8b57;--bar:#1d1d1f}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#fff;line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .todo{background:#fff4d6;color:#8a5a00;border-radius:4px;padding:0 4px}

  /* ===== 黑色橫欄 ===== */
  .topbar{position:sticky;top:0;z-index:30;background:var(--bar)}
  .topbar .in{max-width:1200px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:18px}
  .brand{color:#fff;font-weight:700;font-size:20px;letter-spacing:.03em;white-space:nowrap}
  .menu{display:flex;align-items:center;gap:26px;margin-left:auto}
  .menu a{color:#c7c7cc;font-size:15px;white-space:nowrap;transition:color .2s}
  .menu a:hover{color:#fff}
  .menu a.on{color:#fff;font-weight:600;text-shadow:0 0 12px rgba(255,255,255,.35)}
  .menu a.cta{background:var(--accent);color:#fff;padding:8px 20px;border-radius:980px;font-weight:500}
  .lang{display:inline-flex;border:1px solid #48484a;border-radius:980px;overflow:hidden;margin-left:6px}
  .lang button{font:inherit;font-size:13px;background:none;border:0;color:#c7c7cc;padding:4px 11px;cursor:pointer}
  .lang button.on{background:#fff;color:#1d1d1f;font-weight:600}
  .burger{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;margin-left:auto}

  /* ===== 分頁 ===== */
  .page{display:none;scroll-margin-top:64px}
  .page.show{display:block;animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== 首頁主視覺 ===== */
  .hero{position:relative;overflow:hidden;background:#fff;min-height:560px}
  .hero .in{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:70px 24px 190px;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:20px}
  .hero-left{display:flex;align-items:center;gap:28px}
  .hero-logo{width:170px;height:170px;flex:none}
  .hero h1{font-size:clamp(46px,6.5vw,92px);line-height:1.02;margin:0;letter-spacing:-.02em;color:#3a3a3c}
  .hero h1{white-space:nowrap}
  html[lang^=zh] .hero h1{font-size:clamp(40px,5.4vw,76px);line-height:1.12}
  .hero .tag{font-size:clamp(18px,2.2vw,26px);color:var(--green);font-weight:600;margin:10px 0 0}
  .hero-tree{width:100%;max-width:480px;justify-self:end}
  .hills{position:absolute;left:0;right:0;bottom:0;z-index:1;width:100%;height:260px;display:block}

  .wrap{max-width:1080px;margin:0 auto;padding:80px 24px}
  .grey{background:var(--bg)}
  h2.t{font-size:clamp(32px,4.6vw,50px);line-height:1.15;text-align:center;margin:0 0 12px;letter-spacing:-.01em}
  p.l{text-align:center;color:var(--sub);font-size:19px;max-width:700px;margin:0 auto 46px}
  .page-head{text-align:center;padding:70px 24px 10px}
  .page-head .eyebrow{color:var(--green);font-weight:600;font-size:16px;margin:0 0 6px}

  /* 概覽卡片 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  .card{background:#fff;border-radius:22px;padding:28px 26px;color:inherit;display:block;transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
  .card .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px}
  .card .ic svg{width:26px;height:26px}
  .card h3{margin:0 0 6px;font-size:21px}
  .card p{margin:0;color:var(--sub);font-size:15px}
  .card .go{display:inline-block;margin-top:12px;font-size:15px;color:var(--accent)}

  /* 教師簡介 */
  .bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
  .tile{background:#fff;border-radius:24px;padding:30px}
  .tile.dark{background:#000;color:#f5f5f7}.tile.dark p{color:#a1a1a6}
  .s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
  .tile .k{font-size:14px;font-weight:600;color:var(--green);margin:0 0 6px}
  .tile.dark .k{color:#7ee2a8}
  .tile h3{font-size:23px;line-height:1.3;margin:0 0 8px}
  .tile p{margin:0;color:var(--sub)}
  .big{font-size:56px;font-weight:700;line-height:1;margin:6px 0 8px}
  .badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
  .badge{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px;background:#fff}
  .badge i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;color:#fff;font-weight:700;font-size:14px}

  /* 影片 */
  .vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .vid{background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;color:inherit}
  .vid .pic{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:16px 18px;color:#fff;position:relative;overflow:hidden}
  .vid .pic .code{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:980px;position:relative;z-index:1}
  .vid .pic .bg{position:absolute;right:-8px;bottom:-30px;font-size:120px;font-weight:800;opacity:.15;line-height:1}
  .vid .body{padding:18px 22px 22px}
  .vid h3{margin:0 0 6px;font-size:18.5px;line-height:1.45}
  .vid p{margin:0;color:var(--sub);font-size:14.5px}
  .chip{display:inline-block;font-size:12.5px;padding:1px 10px;border-radius:980px;background:var(--bg);color:var(--sub);margin:0 6px 8px 0}
  .chip.done{background:#e3f4e8;color:#1e7b45}.chip.wip{background:#fff3e0;color:#b25e00}
  .center{text-align:center;margin-top:34px}
  .btn{display:inline-block;padding:11px 26px;border-radius:980px;background:var(--accent);color:#fff;font-size:17px}
  .btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}

  /* 課程單元 */
  .unit-bar{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin-bottom:12px}
  .seg{display:inline-flex;background:#e8e8ed;border-radius:12px;padding:3px}
  .seg button{font:inherit;font-size:15px;border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--ink)}
  .seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
  .seg-label{font-size:14px;color:var(--sub);margin-right:6px}
  .unit-sub{text-align:center;color:var(--sub);font-size:14px;margin:0 0 30px}
  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .unit{background:#fff;border-radius:22px;padding:26px 26px 22px;display:flex;flex-direction:column}
  .unit .no{font-size:14px;font-weight:700;color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
  .unit h3{font-size:20px;margin:0 0 2px;line-height:1.35}
  .unit .alt{font-size:13.5px;color:var(--sub)}
  .unit .topic{font-size:13px;color:var(--sub);margin:8px 0 14px}
  .unit ul{list-style:none;margin:auto 0 0;padding:14px 0 0;border-top:1px solid #ececf0}
  .unit li{font-size:14.5px;padding:4px 0;display:flex;gap:8px;align-items:baseline}
  .unit li .ty{flex:none;font-size:12px;padding:0 8px;border-radius:980px;background:var(--bg);color:var(--sub)}
  .unit li .w{color:#b25e00;font-size:12px;flex:none}
  .unit li.none{color:#a1a1a6}
  .note{text-align:center;color:var(--sub);font-size:13px;margin-top:22px}

  /* 數位教學 App */
  .apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px}
  .app{background:#fff;border-radius:20px;padding:24px 18px;text-align:center}
  .app .ic{width:68px;height:68px;border-radius:17px;margin:0 auto 12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .app h3{margin:0 0 4px;font-size:17px}
  .app p{margin:0;color:var(--sub);font-size:13.5px}

  /* 研習時間軸 */
  .timeline{max-width:760px;margin:0 auto;border-left:2px solid var(--line);padding-left:30px}
  .ev{position:relative;padding:0 0 34px}
  .ev:before{content:"";position:absolute;left:-38px;top:8px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  .ev .d{font-size:14px;color:var(--sub)}
  .ev h3{margin:2px 0 4px;font-size:20px}
  .ev p{margin:0;color:var(--sub)}
  .role{display:inline-block;font-size:12.5px;padding:1px 10px;border-radius:980px;background:#e8f1fd;color:var(--accent);margin-left:6px;vertical-align:2px}

  footer{background:var(--bg);color:var(--sub);font-size:12.5px;padding:22px 24px;border-top:1px solid var(--line)}
  footer .in{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  @media (max-width:1060px){ .menu{gap:18px} .menu a{font-size:14px} }
  @media (max-width:940px){
    .burger{display:block}
    .menu{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:flex-start;gap:0;background:var(--bar);padding:6px 24px 18px}
    .menu.open{display:flex}
    .menu a{padding:12px 0;width:100%;border-bottom:1px solid #333;font-size:17px}
    .menu a.cta{width:auto;margin-top:14px;border:0}
    .lang{margin:14px 0 0}
    .hero .in{grid-template-columns:1fr;padding:46px 22px 150px;text-align:left}
    .hero-tree{justify-self:center;max-width:340px}
    .hero-left{flex-direction:column;align-items:flex-start;gap:16px}
    .hero-logo{width:110px;height:110px}
    .bento{grid-template-columns:1fr}.s2,.s3,.s4,.s6{grid-column:span 1}
    .wrap{padding:60px 20px}
  }
  @media (prefers-reduced-motion:reduce){.page.show{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

  $("#gameCards").innerHTML = GAMES.map(g => `<${g.url?`a href="${esc(g.url)}" target="_blank" rel="noopener"`:"div"} class="card">
    <div class="ic" style="background:${g.col}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">${ICONS.games}</svg></div>
    <h3>${esc(lang==="en"?g.en:g.zh)}</h3><p>${esc(lang==="en"?g.den:g.dzh)}</p>
    <span class="go">${g.url?(lang==="en"?"Play ›":"開始 ›"):(lang==="en"?"Coming soon":"即將推出")}</span></${g.url?"a":"div"}>`).join("");
}
function renderApps(){
  $("#appGrid").innerHTML = APPS.map(([ic,bg,name,den,dzh]) => `<div class="app"><div class="ic" style="background:${bg}">${ic}</div><h3>${esc(L(name))}</h3><p>${esc(lang==="en"?den:dzh)}</p></div>`).join("");
}
function renderTalks(){
  $("#talkList").innerHTML = TALKS.map(t => {
    const role = t.role==="speaker" ? (lang==="en"?"Speaker":"講師") : (lang==="en"?"Attendee":"參與");
    const w = s => t.todo ? `<span class="todo">${esc(s)}</span>` : esc(s);
    return `<div class="ev"><div class="d">${esc(t.date)}</div><h3>${w(lang==="en"?t.en:t.zh)}<span class="role">${role}</span></h3><p>${w(lang==="en"?t.den:t.dzh)}</p></div>`;
  }).join("");
}
function renderAll(){ renderNav(); renderText(); renderOverview(); renderVideos(); renderUnits(); renderGames(); renderApps(); renderTalks(); }
function setLang(l){ lang = l; store.set("jenbio_lang", l); renderAll(); }
function route(){
  const id = (location.hash || "#overview").slice(1);
  const ok = document.getElementById(id) && document.getElementById(id).classList.contains("page") ? id : "overview";
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("show", p.id === ok));
  renderNav(); window.scrollTo(0,0); setTimeout(() => window.scrollTo(0,0), 0);
}
$("#burger").onclick = () => $("#menu").classList.toggle("open");
window.addEventListener("hashchange", route);
renderAll(); route();
</script>
</body>
</html>
